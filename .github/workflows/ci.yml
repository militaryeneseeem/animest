name: CI
on:
  pull_request:
  push:
    branches: [main, work]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No pnpm cache is configured here because setup-node requires pnpm-lock.yaml for cache restore.
      # The initial scaffold intentionally installs from manifests until a lockfile is generated in CI or a registry-enabled dev environment.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
